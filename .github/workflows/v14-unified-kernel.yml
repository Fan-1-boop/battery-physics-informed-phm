name: v14 unified source-anchored kernel 55-cell development experiment

on:
  push:
    branches: [research/v14-unified-source-anchored-kernel]
    paths:
      - 'docs/V14_SOURCE_ANCHORED_LOCAL_KERNEL_PROTOCOL_20261012.md'
      - 'experiments/rw_multitarget/source_anchored_kernel_v14.py'
      - 'tests/test_source_anchored_kernel_v14.py'
      - '.github/workflows/v14-unified-kernel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed numerical dependency
        run: python -m pip install numpy==2.4.6
      - name: v8/v9/v10/v12 and new v14 unit tests
        run: |
          python -m unittest discover -s tests -p 'test_rw_multitarget_v8.py' -v
          python -m unittest discover -s tests -p 'test_rw_selection_v9.py' -v
          python -m unittest discover -s tests -p 'test_fixed_budget_v10.py' -v
          python -m unittest discover -s tests -p 'test_reliability_v12.py' -v
          python -m unittest discover -s tests -p 'test_source_anchored_kernel_v14.py' -v
      - name: Execute original 55 XJTU cell experiment with frozen v12 parity
        run: python experiments/rw_multitarget/source_anchored_kernel_v14.py --outdir results/v14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-kernel-all-domain-per-cell
          path: results/v14/
          if-no-files-found: ignore
      - name: Commit complete experiment outputs to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v14/*.json
          git diff --cached --quiet || git commit -m "results: record v14 unified kernel all-domain real-cell outcomes"
          git push origin HEAD:refs/heads/research/v14-unified-source-anchored-kernel
