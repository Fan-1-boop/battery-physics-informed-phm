name: v13 oracle diagnostic from frozen v12 archive

on:
  push:
    branches: [research/v13-calibration-oracle-audit]
    paths:
      - 'docs/V13_ORACLE_DIAGNOSTIC_PROTOCOL_20261012.md'
      - 'experiments/rw_multitarget/oracle_diagnostic_v13.py'
      - 'tests/test_oracle_diagnostic_v13.py'
      - '.github/workflows/v13-oracle-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6
      - run: python -m unittest discover -s tests -p 'test_oracle_diagnostic_v13.py' -v
      - name: Run fixed posthoc oracle diagnostic
        run: python experiments/rw_multitarget/oracle_diagnostic_v13.py --output results/v13/oracle_diagnostics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-oracle-diagnostic
          path: results/v13/oracle_diagnostics.json
          if-no-files-found: ignore
      - name: Commit audit outcome
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v13/oracle_diagnostics.json
          git diff --cached --quiet || git commit -m "results: archive v13 posthoc oracle hierarchy on frozen cells"
          git push origin HEAD:refs/heads/research/v13-calibration-oracle-audit
