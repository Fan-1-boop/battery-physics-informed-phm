name: v17 FINAL predeclared GO-NO-GO on untouched cells

on:
  push:
    branches: [research/v17-final-go-no-go]
    paths:
      - 'docs/V17_FINAL_GO_NO_GO_PROTOCOL_20261021.md'
      - 'docs/v17_final_unseen_manifest.json'
      - 'experiments/rw_multitarget/final_go_no_go_v17.py'
      - 'tests/test_final_go_no_go_v17.py'
      - '.github/workflows/v17-final-decision.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fixed dependencies
        run: python -m pip install numpy==2.4.6
      - name: Full historical code audit and new decision guard tests
        run: |
          python -m unittest discover -s tests -p 'test_rw_multitarget_v8.py' -v
          python -m unittest discover -s tests -p 'test_rw_selection_v9.py' -v
          python -m unittest discover -s tests -p 'test_fixed_budget_v10.py' -v
          python -m unittest discover -s tests -p 'test_reliability_v12.py' -v
          python -m unittest discover -s tests -p 'test_source_anchored_kernel_v14.py' -v
          python -m unittest discover -s tests -p 'test_disagreement_calibration_v15.py' -v
          python -m unittest discover -s tests -p 'test_external_validation_v16.py' -v
          python -m unittest discover -s tests -p 'test_final_go_no_go_v17.py' -v
      - name: Evaluate exactly 88 frozen external raw files and compute mandatory verdict
        run: python experiments/rw_multitarget/final_go_no_go_v17.py --outdir results/v17
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v17-unseen-cohorts-binding-final-decision
          path: results/v17/
          if-no-files-found: ignore
      - name: Archive full experiment and mandatory GO-NO-GO answer
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v17/*.json
          git diff --cached --quiet || git commit -m "results: archive v17 fresh-target test and binding go-no-go decision"
          git push origin HEAD:refs/heads/research/v17-final-go-no-go
